services:
  - type: web
    name: sj-realtime
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./react-app/server/Dockerfile
    dockerContext: ./react-app
    healthCheckPath: /health/ready
    numInstances: 1
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_ORIGIN
        value: https://sj.wizide.com
      - key: RUNTIME_DATA_DIR
        value: /app/runtime
      - key: REALTIME_ONLY_MODE
        value: "true"
