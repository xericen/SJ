<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="referrer" content="strict-origin-when-cross-origin"/>
  <link rel="icon" type="image/png" href="/assets/brand/sejong-hanbakwi.png"/>
  <title>세종한바퀴</title>
  <script>
    (() => {
      // Chromium extensions can leave a rejected messaging promise behind
      // when their background worker closes. It is not an application error,
      // so silence only this exact browser-extension rejection.
      const closedExtensionChannel = /A listener indicated an asynchronous response by returning true, but the message channel closed before a response was received|The message port closed before a response was received/i;
      const getRejectionMessage = reason => {
        if (typeof reason === 'string') return reason;
        if (!reason || typeof reason !== 'object') return '';
        if (typeof reason.message === 'string') return reason.message;
        if (reason.reason) return getRejectionMessage(reason.reason);
        return '';
      };
      window.addEventListener('unhandledrejection', event => {
        const message = getRejectionMessage(event.reason);
        if (closedExtensionChannel.test(message)) event.preventDefault();
      });
    })();
  </script>
  <script>
    (() => {
      try {
        window.localStorage.getItem('__storage_probe__');
      } catch {
        const values = new Map();
        const memoryStorage = {
          get length() {
            return values.size;
          },
          key(index) {
            return [...values.keys()][index] ?? null;
          },
          getItem(key) {
            return values.has(String(key))
              ? values.get(String(key))
              : null;
          },
          setItem(key, value) {
            values.set(String(key), String(value));
          },
          removeItem(key) {
            values.delete(String(key));
          },
          clear() {
            values.clear();
          },
        };

        Object.defineProperty(
          window,
          'localStorage',
          {
            configurable: true,
            value: memoryStorage,
          },
        );
      }
    })();
  </script>
  <script>
    (() => {
      if (window.parent === window) return;
      let immediateParentOrigin = '';
      try {
        immediateParentOrigin = new URL(document.referrer).origin;
      } catch {
        try {
          immediateParentOrigin = window.parent.location.origin;
        } catch {
          return;
        }
      }
      if (!immediateParentOrigin) return;
      let sdkConfig;
      Object.defineProperty(window, 'ReviewOpsSDK', {
        configurable: true,
        get() {
          return sdkConfig;
        },
        set(value) {
          sdkConfig = {
            ...(value && typeof value === 'object' ? value : {}),
            parentOrigin: immediateParentOrigin,
            allowedOrigins: [immediateParentOrigin],
          };
        },
      });
    })();
  </script>
  <script>
    (() => {
      const buildId = '__JOCHWON_BUILD_ID__';
      const url = new URL(window.location.href);
      if (url.searchParams.get('_build') === buildId) return;
      // The HTML itself is always served with no-cache and every asset has a
      // content hash. Normalize stale callback URLs without navigating again;
      // a second navigation can execute the entry from both page lifecycles.
      if ('caches' in window) {
        void caches.keys().then(keys => Promise.all(keys.map(key => caches.delete(key))));
      }
      if ('serviceWorker' in navigator) {
        void navigator.serviceWorker.getRegistrations().then(registrations => Promise.all(registrations.map(registration => registration.unregister())));
      }
      url.searchParams.set('_build', buildId);
      url.searchParams.delete('_entry_retry');
      window.history.replaceState({}, document.title, `${url.pathname}${url.search}${url.hash}`);
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
