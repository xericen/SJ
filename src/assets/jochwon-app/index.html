  <title>세종한바퀴</title>
  <script>
    (() => {
      try {
        window.localStorage.getItem('__storage_probe__');
      } catch {
        const values = new Map();
        const memoryStorage = {
          get length() {
            return values.size;
          },
          key(index) {
            return [...values.keys()][index] ?? null;
          },
          getItem(key) {
            return values.has(String(key))
              ? values.get(String(key))
              : null;
          },
          setItem(key, value) {
            values.set(String(key), String(value));
          },
          removeItem(key) {
            values.delete(String(key));
          },
          clear() {
            values.clear();
          },
        };

        Object.defineProperty(
          window,
          'localStorage',
          {
            configurable: true,
            value: memoryStorage,
          },
        );
      }
    })();
  </script>
  <script>
    (() => {
      if (window.parent === window) return;
      let immediateParentOrigin = '';
      try {
        immediateParentOrigin = window.parent.location.origin;
      } catch {
        try {
          immediateParentOrigin = new URL(document.referrer).origin;
        } catch {
          return;
        }
      }
      if (!immediateParentOrigin) return;
      let sdkConfig;
      Object.defineProperty(window, 'ReviewOpsSDK', {
        configurable: true,
        get() {
          return sdkConfig;
        },
        set(value) {
          sdkConfig = {
            ...(value && typeof value === 'object' ? value : {}),
            parentOrigin: immediateParentOrigin,
          };
        },
      });
    })();
  </script>
  <script>
    (() => {
      const buildId = '20260806-garden-bear-merge-v143';
      const url = new URL(window.location.href);
      if (url.searchParams.get('_build') === buildId) return;
      if ('caches' in window) {
        void caches.keys().then(keys => Promise.all(keys.map(key => caches.delete(key))));
      }
      if ('serviceWorker' in navigator) {
        void navigator.serviceWorker.getRegistrations().then(registrations => Promise.all(registrations.map(registration => registration.unregister())));
      }
      url.searchParams.set('_build', buildId);
      window.location.replace(url.toString());
    })();
  </script>
  <script>
  (() => {
    const runtimeBuildId="20260806-garden-bear-merge-v143";
    const runtimeEntryPath="/auth/jochwon-assets/assets/index-DQp5SDfV.js";
    const pageUrl=new URL(window.location.href);
    const entryRetry=pageUrl.searchParams.get('_entry_retry');
    let recoveryStarted=false;
    const recover=async()=>{
      if(recoveryStarted)return;
      recoveryStarted=true;
      if(entryRetry){
        const root=document.getElementById('root');
        if(root)root.textContent='새 버전을 불러오지 못했습니다. 페이지를 새로고침해 주세요.';
        return;
      }
      const cacheReset='caches' in window
        ?caches.keys().then(keys=>Promise.all(keys.map(key=>caches.delete(key)))).catch(()=>undefined)
        :Promise.resolve();
      const workerReset='serviceWorker' in navigator
        ?navigator.serviceWorker.getRegistrations().then(items=>Promise.all(items.map(item=>item.unregister()))).catch(()=>undefined)
        :Promise.resolve();
      await Promise.all([cacheReset,workerReset]);
      pageUrl.searchParams.set('_build',runtimeBuildId);
      pageUrl.searchParams.set('_entry_retry',String(Date.now()));
      window.location.replace(pageUrl.toString());
    };
    window.__recoverJochwonRuntime=recover;
    window.addEventListener('error',event=>{
      const filename=typeof event.filename==='string'?event.filename:'';
      if(filename.includes(runtimeEntryPath))void recover();
    });
  })();
</script>
