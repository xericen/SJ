<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="referrer" content="strict-origin-when-cross-origin"/>
  <link rel="icon" href="data:,"/>
  <title>세종한바퀴</title>
  <script>
    (() => {
      try {
        window.localStorage.getItem('__storage_probe__');
      } catch {
        const values = new Map();
        const memoryStorage = {
          get length() {
            return values.size;
          },
          key(index) {
            return [...values.keys()][index] ?? null;
          },
          getItem(key) {
            return values.has(String(key))
              ? values.get(String(key))
              : null;
          },
          setItem(key, value) {
            values.set(String(key), String(value));
          },
          removeItem(key) {
            values.delete(String(key));
          },
          clear() {
            values.clear();
          },
        };

        Object.defineProperty(
          window,
          'localStorage',
          {
            configurable: true,
            value: memoryStorage,
          },
        );
      }
    })();
  </script>
  <script>
    (() => {
      if (window.parent === window) return;
      let immediateParentOrigin = '';
      try {
        immediateParentOrigin = window.parent.location.origin;
      } catch {
        try {
          immediateParentOrigin = new URL(document.referrer).origin;
        } catch {
          return;
        }
      }
      if (!immediateParentOrigin) return;
      let sdkConfig;
      Object.defineProperty(window, 'ReviewOpsSDK', {
        configurable: true,
        get() {
          return sdkConfig;
        },
        set(value) {
          sdkConfig = {
            ...(value && typeof value === 'object' ? value : {}),
            parentOrigin: immediateParentOrigin,
          };
        },
      });
    })();
  </script>
  <script>
    (() => {
      const buildId = '20260805-arts-original-poster-v64';
      const url = new URL(window.location.href);
      if (url.searchParams.get('_build') === buildId) return;
      if ('caches' in window) {
        void caches.keys().then(keys => Promise.all(keys.map(key => caches.delete(key))));
      }
      if ('serviceWorker' in navigator) {
        void navigator.serviceWorker.getRegistrations().then(registrations => Promise.all(registrations.map(registration => registration.unregister())));
      }
      url.searchParams.set('_build', buildId);
      window.location.replace(url.toString());
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
